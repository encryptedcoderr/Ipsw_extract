name: IPSW Extraction Workflow (iOS 18.4.1)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install ipsw
          # Install jtool2
          curl -L https://newosxbook.com/tools/jtool2.tgz -o /tmp/jtool2.tgz
          tar -xzf /tmp/jtool2.tgz -C /tmp
          sudo mv /tmp/jtool2 /usr/local/bin/
          chmod +x /usr/local/bin/jtool2

      - name: Download IPSW (iPhone 16, iOS 18.4.1 build 22E252)
        run: |
          mkdir -p firmware
          # YOUR WORKING LINK
          URL="https://updates.cdn-apple.com/2025SpringFCS/fullrestores/082-30380/AD76C77E-51AA-4D55-A074-9C0E7545D784/iPhone17,3_18.4.1_22E252_Restore.ipsw"
          echo "Downloading from: $URL"
          curl -L --retry 3 --retry-delay 2 -o firmware/device.ipsw "$URL"
          ls -lh firmware/device.ipsw
          # Verify download succeeded
          if [ ! -s firmware/device.ipsw ]; then
            echo "ERROR: IPSW download failed"
            exit 1
          fi

      - name: Extract Kernel and dyld_shared_cache
        run: |
          mkdir -p kit/kernel kit/dyld
          ipsw extract --kernel firmware/device.ipsw --output kit/kernel
          ipsw extract --dyld firmware/device.ipsw --output kit/dyld
          echo "Kernel: $(ls kit/kernel/)"
          echo "dyld_shared_cache: $(find kit/dyld -name 'dyld_shared_cache_arm64e')"

      - name: Extract JavaScriptCore, WebCore, AVFAudio
        run: |
          DSC=$(find kit/dyld -name 'dyld_shared_cache_arm64e' | head -1)
          mkdir -p kit/jsc kit/webcore kit/avfaudio
          ipsw dyld extract "$DSC" JavaScriptCore --output kit/jsc/ --force
          ipsw dyld extract "$DSC" WebCore --output kit/webcore/ --force
          ipsw dyld extract "$DSC" AVFAudio --output kit/avfaudio/ --force
          ls -lh kit/jsc/ kit/webcore/ kit/avfaudio/

      - name: Extract All Symbol Offsets (jtool2)
        run: |
          JSC=$(find kit/jsc -type f | head -1)
          WEBCORE=$(find kit/webcore -type f | head -1)
          AVFAUDIO=$(find kit/avfaudio -type f | head -1)

          echo "=== iOS 18.4.1 (22E252) Offsets ===" > kit/offsets.txt
          echo "" >> kit/offsets.txt

          for file in "$JSC" "$WEBCORE" "$AVFAUDIO"; do
            name=$(basename "$file")
            echo "--- $name ---" >> kit/offsets.txt
            jtool2 --arch arm64e -d "$file" 2>/dev/null | \
              grep -E 'AVSpeechSynthesis|AVLoadSpeech|globalFuncParseFloat|jitAllowList|DedicatedWorkerGlobalScope|allScriptExecutionContextsMap' \
              >> kit/offsets.txt || true
          done

          # dyld symbols
          echo "--- dyld ---" >> kit/offsets.txt
          jtool2 --arch arm64e -d /usr/lib/dyld 2>/dev/null | \
            grep -E 'dlopen|dlsym|gAPIs' >> kit/offsets.txt || true

          cat kit/offsets.txt

      - name: Generate rce_offsets Entry (JavaScript)
        run: |
          cat > kit/generate_offsets.js << 'EOF'
          const fs = require('fs');

          // These values must be extracted from kit/offsets.txt
          // Replace the placeholders with actual hex addresses
          const offsets = {
              "AVFAudio__AVLoadSpeechSynthesisImplementation_onceToken": "0x????????n",
              "AVFAudio__OBJC_CLASS__AVSpeechSynthesisMarker": "0x????????n",
              "AVFAudio__OBJC_CLASS__AVSpeechSynthesisVoice": "0x????????n",
              "JavaScriptCore__globalFuncParseFloat": "0x????????n",
              "JavaScriptCore__jitAllowList": "0x????????n",
              "JavaScriptCore__jitAllowList_once": "0x????????n",
              "WebCore__DedicatedWorkerGlobalScope_vtable": "0x????????n",
              "WebCore__ZZN7WebCoreL29allScriptExecutionContextsMapEvE8contexts": "0x????????n",
              "dyld__dlopen_from_lambda_ret": "0x????????n",
              "dyld__signPointer": "0x????????n",
              "dyld__gAPIs": "0x????????n"
          };

          const device_model = "iPhone17,3_18.4.1_22E252";
          const output = `rce_offsets["${device_model}"] = ${JSON.stringify(offsets, null, 3)};`;
          fs.writeFileSync('kit/rce_offsets_entry.js', output);
          console.log("Generated: kit/rce_offsets_entry.js");
          console.log(output);
          EOF
          node kit/generate_offsets.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipsw-out-22E252
          path: ipsw_out.tgz
          retention-days: 30
