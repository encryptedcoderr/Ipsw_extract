name: IPSW Extraction Workflow (Improved)

on:
  workflow_dispatch:
    inputs:
      device_model:
        required: true
        default: 'iPhone17,3'
      build_number:
        required: true
        default: '22E252'
      ios_version:
        required: true
        default: '18.4.1'

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install ipsw radare2
          curl -L https://newosxbook.com/tools/jtool2.tgz -o /tmp/jtool2.tgz
          tar -xzf /tmp/jtool2.tgz -C /tmp
          sudo mv /tmp/jtool2 /usr/local/bin/
          chmod +x /usr/local/bin/jtool2

      - name: Download IPSW
        run: |
          mkdir -p firmware
          URL="https://updates.cdn-apple.com/2025SpringFCS/fullrestores/082-30380/AD76C77E-51AA-4D55-A074-9C0E7545D784/${{ github.event.inputs.device_model }}_${{ github.event.inputs.ios_version }}_${{ github.event.inputs.build_number }}_Restore.ipsw"
          echo "Downloading: $URL"
          curl -L --retry 3 -o firmware/device.ipsw "$URL"

      - name: Extract Kernel + dyld
        run: |
          mkdir -p kit/kernel kit/dyld
          ipsw extract --kernel firmware/device.ipsw --output kit/kernel
          ipsw extract --dyld firmware/device.ipsw --output kit/dyld

      - name: Reassemble dyld cache
        run: |
          CACHE_DIR=$(find kit/dyld -type d | head -1)
          cd "$CACHE_DIR"

          if ls dyld_shared_cache_arm64e.* 1>/dev/null 2>&1; then
            cat dyld_shared_cache_arm64e.* > combined
            mv combined dyld_shared_cache_arm64e.combined
          fi

      - name: Locate dyld cache
        run: |
          DSC=$(find kit/dyld -name "*arm64e*" | head -1)
          echo "DSC=$DSC" >> $GITHUB_ENV
          echo "Using cache: $DSC"

      - name: Extract frameworks (best effort)
        run: |
          mkdir -p kit/fw
          ipsw dyld extract "$DSC" "JavaScriptCore" --output kit/fw || true
          ipsw dyld extract "$DSC" "WebCore" --output kit/fw || true
          ipsw dyld extract "$DSC" "AVFAudio" --output kit/fw || true

      # 🔥 MUCH BETTER SYMBOL HARVEST
      - name: Build offsets.txt (multi-source)
        run: |
          echo "=== SYMBOL DUMP ===" > kit/offsets.txt

          echo "[dyld strings]" >> kit/offsets.txt
          strings "$DSC" | grep -E "ParseFloat|jit|AVSpeech|dlopen" >> kit/offsets.txt || true

          echo "" >> kit/offsets.txt
          echo "[jtool2 symbols]" >> kit/offsets.txt
          jtool2 -S "$DSC" 2>/dev/null | grep -E "ParseFloat|jit|AVSpeech|dlopen" >> kit/offsets.txt || true

          echo "" >> kit/offsets.txt
          echo "[framework nm]" >> kit/offsets.txt

          for f in $(find kit/fw -type f); do
            echo "--- $f ---" >> kit/offsets.txt
            nm "$f" 2>/dev/null | grep -E "ParseFloat|jit|AVSpeech|dlopen" >> kit/offsets.txt || true
          done

      # 🔍 DEBUG VISIBILITY
      - name: DEBUG offsets.txt
        run: |
          echo "=========== OFFSETS CONTENT ==========="
          head -200 kit/offsets.txt || echo "NO FILE"
          echo "======================================"

      # ✅ FIXED + IMPROVED PARSER
      - name: Parse + Generate rce_offsets
        run: |
          cat > kit/parse.py << 'PYTHON'
          import re, os, json

          data = open("kit/offsets.txt").read()

          patterns = {
              "JavaScriptCore__ParseFloat": r'([0-9a-f]{8,16}).*ParseFloat',
              "JavaScriptCore__jit": r'([0-9a-f]{8,16}).*jit',
              "AVFAudio__AVSpeech": r'([0-9a-f]{8,16}).*AVSpeech',
              "dyld__dlopen": r'([0-9a-f]{8,16}).*dlopen',
          }

          offsets = {}

          for k, p in patterns.items():
              m = re.search(p, data, re.I)
              if m:
                  offsets[k] = f"0x{m.group(1)}n"
                  print(f"[FOUND] {k} -> {offsets[k]}")
              else:
                  print(f"[MISS] {k}")

          device = os.environ["DEVICE_MODEL"]
          ios = os.environ["IOS_VERSION"]
          build = os.environ["BUILD_NUMBER"]

          key = f"{device}_{ios}_{build}".replace(".", "_")

          output = f'rce_offsets["{key}"] = {json.dumps(offsets, indent=2)};'

          open("kit/rce_offsets_entry.js", "w").write(output)

          print("\n=== FINAL OUTPUT ===\n")
          print(output)
          PYTHON

          DEVICE_MODEL="${{ github.event.inputs.device_model }}" \
          IOS_VERSION="${{ github.event.inputs.ios_version }}" \
          BUILD_NUMBER="${{ github.event.inputs.build_number }}" \
          python3 kit/parse.py

      - name: Package
        run: |
          tar -czf out.tgz kit/
          ls -la kit/

      - uses: actions/upload-artifact@v4
        with:
          name: ipsw-output
          path: out.tgz
