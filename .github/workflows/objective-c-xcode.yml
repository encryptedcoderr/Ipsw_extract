name: IPSW Extraction Workflow

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install ipsw
          # jtool2 is not in homebrew core — pull the binary directly
          curl -L https://newosxbook.com/tools/jtool2.tgz | tar -xz -C /usr/local/bin jtool2
          chmod +x /usr/local/bin/jtool2

      - name: Download IPSW
        run: |
          mkdir -p firmware
          curl -L \
            "https://updates.cdn-apple.com/2025SummerFCS/fullrestores/082-98952/853D36FA-A5F4-4B75-B5F3-8D38430F6132/iPhone17,3_18.6_22G86_Restore.ipsw" \
            -o firmware/iPhone17,3_18.6_22G86_Restore.ipsw
          ls -lh firmware

      - name: Extract Kernel
        run: |
          mkdir -p kit/kernel
          ipsw extract \
            --kernel \
            firmware/iPhone17,3_18.6_22G86_Restore.ipsw \
            --output kit/kernel

      - name: Kernel Analysis
        run: |
          # Prefer the research kernelcache (more symbols); fall back to release.
          # All ipsw kernel subcommands take the extracted Mach-O, NOT the IPSW zip.
          KC=$(find kit/kernel -name 'kernelcache.research.*' | head -1)
          if [ -z "$KC" ]; then
            KC=$(find kit/kernel -name 'kernelcache.release.*' | head -1)
          fi
          echo "Using kernelcache: $KC"
          file "$KC"

          # ipsw extract --kernel already produces a raw Mach-O.
          # kernel dec is only needed for a still-wrapped im4p.
          if file "$KC" | grep -q 'Mach-O'; then
            echo "Already a Mach-O — skipping kernel dec, copying directly"
            cp "$KC" kit/kernel/kernel.decompressed
          else
            echo "img4/im4p wrapped — decompressing"
            ipsw kernel dec "$KC" --output kit/kernel/kernel.decompressed
          fi

          file kit/kernel/kernel.decompressed

          # kexts and syscall take the extracted kernelcache, not the IPSW zip
          ipsw kernel kexts   kit/kernel/kernel.decompressed > kit/kernel/kexts.txt
          ipsw kernel syscall kit/kernel/kernel.decompressed > kit/kernel/syscalls.txt

          # symbolicate accepts either; IPSW gives it access to signatures
          ipsw kernel symbolicate \
            firmware/iPhone17,3_18.6_22G86_Restore.ipsw \
            --output kit/kernel || \
            echo "Symbolication skipped (no matching signatures available)"

      - name: Extract dyld_shared_cache
        run: |
          mkdir -p kit/dyld
          ipsw extract \
            --dyld \
            firmware/iPhone17,3_18.6_22G86_Restore.ipsw \
            --output kit/dyld

      # ── JSC: Mount DMG and extract JavaScriptCore binary ──────────────────
      - name: Mount DMG and Extract JavaScriptCore
        run: |
          mkdir -p kit/jsc
          IPSW=firmware/iPhone17,3_18.6_22G86_Restore.ipsw

          # List all DMGs inside the IPSW zip; pick the largest (root filesystem)
          unzip -l "$IPSW" | grep '\.dmg' | awk '{print $NF}' > /tmp/dmg_list.txt
          echo "=== DMGs in IPSW ===" && cat /tmp/dmg_list.txt

          ROOTFS_DMG=$(unzip -l "$IPSW" | grep '\.dmg' \
            | sort -k1 -rn | head -1 | awk '{print $NF}')
          echo "Extracting DMG: $ROOTFS_DMG"
          unzip -o "$IPSW" "$ROOTFS_DMG" -d /tmp/ipsw_dmg/

          # Mount read-only; capture the mount point
          MOUNT_OUT=$(hdiutil attach -readonly -nobrowse \
            "/tmp/ipsw_dmg/$ROOTFS_DMG" 2>&1)
          echo "$MOUNT_OUT"
          MOUNT_PT=$(echo "$MOUNT_OUT" | awk '/\/Volumes\// {print $NF}' | head -1)
          echo "Mounted at: $MOUNT_PT"

          JSC_SRC="$MOUNT_PT/System/Library/Frameworks/JavaScriptCore.framework/JavaScriptCore"
          if [ -f "$JSC_SRC" ]; then
            cp "$JSC_SRC" kit/jsc/JavaScriptCore
            echo "Copied $(wc -c < kit/jsc/JavaScriptCore) bytes"
          else
            echo "ERROR: JavaScriptCore not found at expected path" && exit 1
          fi

          hdiutil detach "$MOUNT_PT" || true

      # ── bmalloc allocator analysis ─────────────────────────────────────────
      - name: bmalloc Allocator Analysis
        run: |
          JSC=kit/jsc/JavaScriptCore

          file "$JSC"
          lipo -info "$JSC" 2>/dev/null || true

          # Extract arm64 slice if fat binary
          if lipo -info "$JSC" 2>/dev/null | grep -q arm64; then
            lipo -extract arm64 "$JSC" -output kit/jsc/JavaScriptCore.arm64 2>/dev/null || \
              cp "$JSC" kit/jsc/JavaScriptCore.arm64
          else
            cp "$JSC" kit/jsc/JavaScriptCore.arm64
          fi
          JSC=kit/jsc/JavaScriptCore.arm64

          echo "=== bmalloc symbols ===" > kit/jsc/bmalloc_analysis.txt
          nm -gU "$JSC" 2>/dev/null \
            | grep -iE 'bmalloc|LargeChunk|heapKind|SmallChunk|MediumChunk|Heap::' \
            >> kit/jsc/bmalloc_analysis.txt || true

          echo "=== Region-size constants (0x10000 / 65536) ===" >> kit/jsc/bmalloc_analysis.txt
          jtool2 -d "$JSC" 2>/dev/null \
            | grep -E '#0x10000|#65536|#0x8000|heapBase|LargeChunk' \
            >> kit/jsc/bmalloc_analysis.txt || true

          echo "=== High-address constants (0xFF.*) ===" >> kit/jsc/bmalloc_analysis.txt
          jtool2 -d "$JSC" 2>/dev/null \
            | grep -E '#0xFF[0-9A-Fa-f]{6}' \
            >> kit/jsc/bmalloc_analysis.txt || true

          cat kit/jsc/bmalloc_analysis.txt

      # ── JSArrayBuffer struct layout ────────────────────────────────────────
      - name: JSArrayBuffer Struct Layout
        run: |
          JSC=kit/jsc/JavaScriptCore.arm64

          echo "=== JSArrayBuffer m_data offset analysis ===" \
            > kit/jsc/jsarraybuffer_layout.txt

          jtool2 -d "$JSC" 2>/dev/null \
            | grep -A 60 'JSArrayBuffer' \
            | grep -E 'str|ldr|stp|ldp|m_data|offset|0x[0-9a-f]{1,3}\]' \
            >> kit/jsc/jsarraybuffer_layout.txt || true

          echo "=== JSArrayBuffer symbols ===" >> kit/jsc/jsarraybuffer_layout.txt
          nm -gU "$JSC" 2>/dev/null \
            | grep 'JSArrayBuffer' \
            >> kit/jsc/jsarraybuffer_layout.txt || true

          echo "=== Offsets 0x40..0x100 in JSArrayBuffer context ===" \
            >> kit/jsc/jsarraybuffer_layout.txt
          jtool2 -d "$JSC" 2>/dev/null \
            | grep -A 80 'JSArrayBuffer' \
            | grep -E '\[x[0-9]+, #0x[3-9][0-9a-f]\]|\[x[0-9]+, #0x[1-9][0-9a-f]{2}\]' \
            >> kit/jsc/jsarraybuffer_layout.txt || true

          cat kit/jsc/jsarraybuffer_layout.txt

      # ── idevicesyslog methodology (USB-only, documented for local use) ─────
      - name: Document idevicesyslog Methodology
        run: |
          cat > kit/jsc/idevicesyslog_method.txt << 'EOF'
          USB-only — not executed in CI.

          Prerequisites:
            brew install libimobiledevice
            idevicepair pair        # device must trust this host

          Capture command:
            idevicesyslog \
              | grep -E 'GC.*heap|0xFF[A-F0-9]{6}' \
              | tee kit/jsc/gc_heap_log.txt

          What to look for:
            [JSC] GC: heap region 0xFFCB0000 size 0x10000
              → confirms CRITICAL3 heap base and 64 KiB region granularity

          Interpretation:
            Stable 0xFFCBxxxx across sessions:
              Allocator uses a fixed high-address preference;
              ASLR slides within a narrow window — base is predictable.
            Varying 0xFFCBxxxx across sessions:
              ASLR range is wide; offset must be probed per-run.
          EOF
          cat kit/jsc/idevicesyslog_method.txt

      - name: Package Output
        run: tar -czf ipsw_out.tgz kit/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipsw-out
          path: ipsw_out.tgz
