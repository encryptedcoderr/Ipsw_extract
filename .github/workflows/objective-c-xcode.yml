name: IPSW Extraction Workflow (iOS 18.4.1)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: 'Device Model (e.g., iPhone17,3)'
        required: true
        default: 'iPhone17,3'
      build_number:
        description: 'Build Number (e.g., 22E252)'
        required: true
        default: '22E252'
      ios_version:
        description: 'iOS Version (e.g., 18.4.1)'
        required: true
        default: '18.4.1'

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install ipsw
          curl -L https://newosxbook.com/tools/jtool2.tgz -o /tmp/jtool2.tgz
          tar -xzf /tmp/jtool2.tgz -C /tmp
          sudo mv /tmp/jtool2 /usr/local/bin/
          chmod +x /usr/local/bin/jtool2
          brew install radare2

      - name: Download IPSW
        run: |
          mkdir -p firmware
          URL="https://updates.cdn-apple.com/2025SpringFCS/fullrestores/082-30380/AD76C77E-51AA-4D55-A074-9C0E7545D784/${{ github.event.inputs.device_model }}_${{ github.event.inputs.ios_version }}_${{ github.event.inputs.build_number }}_Restore.ipsw"
          echo "Downloading from: $URL"
          curl -L --retry 3 --retry-delay 2 -o firmware/device.ipsw "$URL"
          ls -lh firmware/device.ipsw
          if [ ! -s firmware/device.ipsw ]; then
            echo "ERROR: IPSW download failed"
            exit 1
          fi

      - name: Extract Kernel and dyld_shared_cache
        run: |
          mkdir -p kit/kernel kit/dyld
          ipsw extract --kernel firmware/device.ipsw --output kit/kernel
          ipsw extract --dyld firmware/device.ipsw --output kit/dyld

      - name: Reassemble dyld_shared_cache
        run: |
          CACHE_DIR=$(find kit/dyld -type d -name "*${{ github.event.inputs.build_number }}*" | head -1)
          cd "$CACHE_DIR"

          if ls dyld_shared_cache_arm64e.?? 2>/dev/null; then
            cat dyld_shared_cache_arm64e.?? > dyld_shared_cache_arm64e.combined
          fi

          cd ..
          DSC=$(find . -name "dyld_shared_cache_arm64e" -type f ! -name "*.combined" | head -1)
          if [ -n "$DSC" ]; then
            ipsw dyld symbols "$DSC" > dyld_symbols.txt 2>/dev/null || true
          fi

      - name: Extract Frameworks
        run: |
          CACHE_DIR=$(find kit/dyld -type d -name "*${{ github.event.inputs.build_number }}*" | head -1)
          DSC=$(find "$CACHE_DIR" -name "dyld_shared_cache_arm64e" -type f ! -name "*.combined" | head -1)

          if [ -z "$DSC" ]; then
            DSC="$CACHE_DIR/dyld_shared_cache_arm64e.combined"
          fi

          mkdir -p kit/jsc kit/webcore kit/avfaudio kit/dyld_bin

          ipsw dyld extract "$DSC" "JavaScriptCore" --output kit/jsc/ --force || true
          ipsw dyld extract "$DSC" "WebCore" --output kit/webcore/ --force || true
          ipsw dyld extract "$DSC" "AVFAudio" --output kit/avfaudio/ --force || true
          ipsw dyld extract "$DSC" "/usr/lib/dyld" --output kit/dyld_bin/ --force || true

      - name: Extract Offsets
        run: |
          CACHE_DIR=$(find kit/dyld -type d -name "*${{ github.event.inputs.build_number }}*" | head -1)
          SYMBOLS="$CACHE_DIR/dyld_shared_cache_arm64e.symbols"

          echo "=== Offsets ===" > kit/offsets.txt

          if [ -f "$SYMBOLS" ]; then
            grep -E "ParseFloat|jitAllowList|Worker|AVSpeech|dlopen" "$SYMBOLS" >> kit/offsets.txt || true
          fi

          for dir in jsc webcore avfaudio; do
            FW=$(find kit/$dir -type f | head -1)
            if [ -f "$FW" ]; then
              nm -gU "$FW" 2>/dev/null | grep -E "ParseFloat|jitAllowList|Worker|AVSpeech" >> kit/offsets.txt || true
            fi
          done

      # ✅ FIXED STEP
      - name: Parse Offsets and Generate rce_offsets Entry
        run: |
          cat > kit/parse_and_generate.py << 'PYTHON'
          import re, os, json

          def parse_offsets(path):
              offsets = {}
              if not os.path.exists(path):
                  return offsets

              data = open(path).read()

              patterns = {
                  "JavaScriptCore__globalFuncParseFloat": r'globalFuncParseFloat.*?([0-9a-f]{8,16})',
                  "JavaScriptCore__jitAllowList": r'jitAllowList.*?([0-9a-f]{8,16})',
                  "AVFAudio__AVSpeech": r'AVSpeech.*?([0-9a-f]{8,16})',
                  "dyld__dlopen": r'dlopen.*?([0-9a-f]{8,16})',
              }

              for k, p in patterns.items():
                  m = re.search(p, data, re.I)
                  if m:
                      offsets[k] = f"0x{m.group(1)}n"

              return offsets

          offsets = parse_offsets("kit/offsets.txt")

          device = os.environ.get("DEVICE_MODEL")
          ios = os.environ.get("IOS_VERSION")
          build = os.environ.get("BUILD_NUMBER")

          key = f"{device}_{ios}_{build}".replace(".", "_")

          output = f'rce_offsets["{key}"] = {json.dumps(offsets, indent=2)};'

          open("kit/rce_offsets_entry.js", "w").write(output)

          print(output)
          PYTHON

          DEVICE_MODEL="${{ github.event.inputs.device_model }}" \
          IOS_VERSION="${{ github.event.inputs.ios_version }}" \
          BUILD_NUMBER="${{ github.event.inputs.build_number }}" \
          python3 kit/parse_and_generate.py

      - name: Package Output
        run: |
          tar -czf ipsw_out.tgz kit/
          ls -la kit/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipsw-out-${{ github.event.inputs.build_number }}
          path: ipsw_out.tgz
